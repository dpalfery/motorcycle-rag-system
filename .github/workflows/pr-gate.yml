  # ─────────────────────────────────────────────────────────────────────
  # Documentation entity drift (SF-DOC-DRIFT-*)
  #
  # Runs when code OR docs change: a rename on the code side breaks a
  # documentation reference just as surely as editing the reference does, and
  # only resolution against the CodeGraph index surfaces it — the prose still
  # reads correctly either way.
  # ─────────────────────────────────────────────────────────────────────
  doc-graph-drift:
    name: Documentation Graph Drift
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A cold index is ~1,100 files. Cache it keyed on the tracked source tree so
      # the common case is an incremental `codegraph sync`, not a full rebuild.
      - name: Compute source tree hash
        id: srchash
        run: |
          HASH=$(git ls-files \
            '0-Base/**' '1-Presentation/**' '2-Application/**' \
            '3-Domain/**' '4-Persistence/**' '7-Deployment/**' \
            | sort | xargs -r sha1sum | sha1sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore CodeGraph index
        id: cgcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .codegraph
          key: codegraph-${{ runner.os }}-${{ steps.srchash.outputs.hash }}
          restore-keys: |
            codegraph-${{ runner.os }}-

      - name: Install CodeGraph
        run: npm install -g @colbymchenry/codegraph

      - name: Build or sync the index
        run: |
          if [ -f .codegraph/codegraph.db ]; then
            codegraph sync .
          else
            codegraph index .
          fi

      - name: Verify documentation entity drift
        run: >-
          dotnet run --project 7-Deployment/tools/SkillForge/src/SkillForge.Cli
          -- docs drift . --format table

      - name: Export the documentation graph
        run: >-
          dotnet run --project 7-Deployment/tools/SkillForge/src/SkillForge.Cli
          -- docs graph . --out ./build/doc-graph

      - name: Upload the documentation graph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-graph
          path: build/doc-graph/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Gate summary — single required check
  # ─────────────────────────────────────────────────────────────────────
  pr-gate-summary:
    name: PR Gate Summary
    runs-on: ubuntu-latest
    needs: [build-test, docs-quality, doc-graph-drift, codeql, trivy, semgrep, iac-scan, integration, e2e, skill-gate]
    if: always()

    steps:
      - name: Evaluate gate results
        run: |
          echo "## PR Gate Results" > results.md
          echo "" >> results.md
          echo "| Job | Status |" >> results.md
          echo "|-----|--------|" >> results.md
          echo "| Build & Unit Tests | ${{ needs.build-test.result }} |" >> results.md
          echo "| Documentation Quality | ${{ needs.docs-quality.result }} |" >> results.md
          echo "| Documentation Graph Drift | ${{ needs.doc-graph-drift.result }} |" >> results.md
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> results.md
          echo "| Trivy OSS Security Scan | ${{ needs.trivy.result }} |" >> results.md
          echo "| Semgrep Community SAST | ${{ needs.semgrep.result }} |" >> results.md
          echo "| IaC Security Scan (Checkov) | ${{ needs.iac-scan.result }} |" >> results.md
          echo "| Integration Tests | ${{ needs.integration.result }} |" >> results.md
          echo "| End-to-End Tests | ${{ needs.e2e.result }} |" >> results.md
          echo "| SkillForge Gate | ${{ needs.skill-gate.result }} |" >> results.md
          echo "" >> results.md

          # Fail if any non-skipped required job failed
          FAILED=false
          for result in \
            "${{ needs.build-test.result }}" \
            "${{ needs.docs-quality.result }}" \
            "${{ needs.doc-graph-drift.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.trivy.result }}" \
            "${{ needs.semgrep.result }}" \
            "${{ needs.integration.result }}" \
            "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED=true
              break
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "## :x: Gate FAILED" >> results.md
            echo "" >> results.md
            echo "One or more required jobs failed or were cancelled." >> results.md
            cat results.md
            exit 1
          else
            echo "## :white_check_mark: Gate PASSED" >> results.md
            echo "" >> results.md
            echo "All required checks passed (or were skipped due to path filtering)." >> results.md
            cat results.md
          fi

      - name: Upload gate results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pr-gate-results
          path: results.md
          retention-days: 14

      - name: Comment PR with gate status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('results.md', 'utf8');
            const body = `### PR Gate Status\n\n${results}`;

            // Find existing bot comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### PR Gate Status')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
