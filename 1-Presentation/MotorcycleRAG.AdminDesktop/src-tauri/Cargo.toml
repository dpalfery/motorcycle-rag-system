[package]
name = "motorcyclerag-admin-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "motorcyclerag-admin-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "motorcyclerag_admin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Accepted risk: GHSA-wrw7-89jp-8q8g (glib, MODERATE) flagged via tauri -> gtk 0.18.2's
# Linux webview backend, which pins glib to "^0.18". The fixed glib (0.20.0) is unobtainable:
# upstream gtk3-rs was archived 2024-03-04 (unmaintained, no further 0.18.x-line releases
# possible without a fork) and no Tauri 2.x release has moved off it. This repo's CI never
# builds/ships a Linux target for this app (no cargo/tauri build step targets Linux), so the
# affected code path isn't exercised by anything that reaches users. Revisit if Tauri ships a
# gtk4-rs-based Linux backend, or if a Linux build target is ever added to CI.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
urlencoding = "2"
tokio = { version = "1", features = ["net", "time", "io-util"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
keyring = "3"
rcgen = "0.13"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
