[tool.poetry]
name = "motorcycle-rag-local-processing"
version = "0.1.0"
description = "Local processing service for motorcycle RAG system using Docling and Ollama"
authors = ["MotorcycleRAG Team"]

[tool.poetry.dependencies]
python = ">=3.10,<3.14.1 || >3.14.1,<4.0"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
docling = "^2.112.0"
docling-core = {extras = ["chunking"], version = "^2.87.0"}
tokenizers = ">=0.22.0,<=0.23.0"
transformers = ">=4.57.0,<5.0.0"
torchvision = ">=0.28.0,<0.29.0"
sentencepiece = ">=0.2.0,<0.3.0"
typer = ">=0.20.0,<0.25.0"
ollama = "^0.6.2"
azure-storage-blob = "^12.21.1"
azure-identity = "^1.18.0"
pandas = "^2.1.0"
pydantic = {extras = ["email"], version = "^2.5.0"}
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
openai = "^1.40.0"
httpx = ">=0.28,<1.0.0"
msal = "^1.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^5.0.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.11.0"
pyright = "^1.1.380"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["../../5-Test/local-processing-service.Tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "asyncio: mark test as async"]
asyncio_mode = "auto"
pythonpath = ["src"]

# mypy is the authoritative type checker for Pydantic-aware validation.
# It loads the pydantic.mypy plugin so patterns like
# Field(default_factory=Metadata) and AliasChoices are type-checked correctly,
# complementing Pyright (see pyrightConfig.json) which lacks a Pydantic plugin.
[tool.mypy]
plugins = ["pydantic.mypy"]
# NOTE: python_version is 3.12 (not 3.10 like pyrightConfig.json). The installed
# numpy/pandas bundled stubs (.pyi) use PEP 695 `type` statements, which require
# 3.12+. mypy parses stub files unconditionally (exclude / follow_imports cannot
# suppress stub parsing), so targeting 3.10 raises a fatal [syntax] error in
# numpy's stub and blocks all checking. The runtime venv is Python 3.14 and the
# codebase targets >=3.10, so 3.12 is still conservative for our own code.
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
# Allow third-party libs without stubs (docling, ollama, etc.) without forcing
# per-line ignores across the codebase.
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
