openapi: 3.0.3
info:
  title: MotorcycleRAG Onboarding Approval API
  version: 1.1.0
  description: Interface contracts for the user onboarding, unified admin management, and approval workflow.
servers:
  - url: /
paths:
  /api/access-requests:
    post:
      summary: Submit a public access request from the login page.
      operationId: createAccessRequest
      tags:
        - Access Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequestRequest'
      responses:
        '202':
          description: Request accepted for admin review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAccessRequestResponse'
        '400':
          description: Invalid provider or email payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate pending request for the same provider and email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request throttled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/user-management:
    get:
      summary: List unified user-management rows for pending requests and existing users.
      operationId: listUserManagementRows
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: rowState
          schema:
            $ref: '#/components/schemas/UserManagementRowState'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Current management rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManagementListResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/access-requests/{requestId}/approve:
    post:
      summary: Approve a pending access request and start approval-time onboarding.
      operationId: approveAccessRequest
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAccessRequestRequest'
      responses:
        '200':
          description: Approval recorded and latest management row returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          description: Invalid request or unsupported tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request is not in an approvable state or the row version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/access-requests/{requestId}/retry-onboarding:
    post:
      summary: Retry onboarding for an access request in a failed-onboarding state.
      operationId: retryAccessRequestOnboarding
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryOnboardingRequest'
      responses:
        '200':
          description: Retry accepted and latest management row returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request is not in a retryable onboarding state or the row version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/access-requests/{requestId}/cancel:
    post:
      summary: Cancel a pending access request from the admin management surface.
      operationId: cancelAccessRequest
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAccessRequestRequest'
      responses:
        '200':
          description: Request cancelled and latest management row returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request is not in a cancellable state or the row version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/users/{userId}/change-tier:
    post:
      summary: Change the tier for an existing managed user and reconcile downstream entitlements.
      operationId: changeManagedUserTier
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeManagedUserTierRequest'
      responses:
        '200':
          description: Tier change recorded and latest management row returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '400':
          description: Invalid tier change request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Managed user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is not in a changeable state or the row version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/users/{userId}/cancel:
    post:
      summary: Cancel an existing managed user and revoke effective access without deleting history.
      operationId: cancelManagedUser
      tags:
        - Admin User Management
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelManagedUserRequest'
      responses:
        '200':
          description: User cancelled and latest management row returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin policy or client isolation check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Managed user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User is not in a cancellable state or the row version is stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IdentityProvider:
      type: string
      enum:
        - Microsoft
        - Google
    TierLabel:
      type: string
      enum:
        - trial
        - road runner
        - admin
    RequestDecisionState:
      type: string
      enum:
        - Pending
        - Approved
        - Cancelled
    OnboardingExecutionState:
      type: string
      enum:
        - NotStarted
        - InProgress
        - Failed
        - Completed
        - NotRequired
    ManagedUserAccessState:
      type: string
      enum:
        - None
        - Active
        - Cancelled
        - Disabled
    UserManagementRowState:
      type: string
      enum:
        - PendingApproval
        - OnboardingInProgress
        - OnboardingFailed
        - Active
        - Cancelled
    UserManagementRowType:
      type: string
      enum:
        - PendingRequest
        - ManagedUser
    UserManagementAction:
      type: string
      enum:
        - Approve
        - RetryOnboarding
        - ChangeTier
        - Cancel
    ErrorCode:
      type: string
      enum:
        - InvalidPayload
        - DuplicatePendingRequest
        - InvalidStateTransition
        - ProviderMismatch
        - ConcurrencyConflict
        - NonRetryableFailure
        - AuthorizationFailed
        - NotFound
        - Throttled
    CreateAccessRequestRequest:
      type: object
      required:
        - email
        - provider
      properties:
        email:
          type: string
          format: email
        provider:
          $ref: '#/components/schemas/IdentityProvider'
    PublicAccessRequestResponse:
      type: object
      required:
        - requestId
        - email
        - provider
        - requestDecisionState
        - onboardingExecutionState
        - rowState
        - requestedAtUtc
      properties:
        requestId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        provider:
          $ref: '#/components/schemas/IdentityProvider'
        requestDecisionState:
          $ref: '#/components/schemas/RequestDecisionState'
        onboardingExecutionState:
          $ref: '#/components/schemas/OnboardingExecutionState'
        rowState:
          $ref: '#/components/schemas/UserManagementRowState'
        requestedAtUtc:
          type: string
          format: date-time
        correlationId:
          type: string
        rowVersion:
          type: string
    UserManagementRow:
      type: object
      required:
        - rowId
        - rowType
        - email
        - requestDecisionState
        - onboardingExecutionState
        - managedUserAccessState
        - rowState
        - allowedActions
        - rowVersion
      properties:
        rowId:
          type: string
        rowType:
          $ref: '#/components/schemas/UserManagementRowType'
        accessRequestId:
          type: string
          format: uuid
          nullable: true
        managedUserId:
          type: string
          nullable: true
        email:
          type: string
          format: email
        provider:
          $ref: '#/components/schemas/IdentityProvider'
        assignedTier:
          $ref: '#/components/schemas/TierLabel'
        requestDecisionState:
          $ref: '#/components/schemas/RequestDecisionState'
        onboardingExecutionState:
          $ref: '#/components/schemas/OnboardingExecutionState'
        managedUserAccessState:
          $ref: '#/components/schemas/ManagedUserAccessState'
        rowState:
          $ref: '#/components/schemas/UserManagementRowState'
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/UserManagementAction'
        correlationId:
          type: string
        requestedAtUtc:
          type: string
          format: date-time
          nullable: true
        approvedAtUtc:
          type: string
          format: date-time
          nullable: true
        cancelledAtUtc:
          type: string
          format: date-time
          nullable: true
        lastFailureCode:
          type: string
          nullable: true
        lastFailureMessage:
          type: string
          nullable: true
        rowVersion:
          type: string
    UserManagementListResponse:
      type: object
      required:
        - rows
        - page
        - pageSize
        - totalCount
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UserManagementRow'
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
    ApproveAccessRequestRequest:
      type: object
      required:
        - tier
        - expectedRowVersion
      properties:
        tier:
          $ref: '#/components/schemas/TierLabel'
        expectedRowVersion:
          type: string
    RetryOnboardingRequest:
      type: object
      required:
        - expectedRowVersion
      properties:
        expectedRowVersion:
          type: string
    CancelAccessRequestRequest:
      type: object
      required:
        - expectedRowVersion
        - reason
      properties:
        expectedRowVersion:
          type: string
        reason:
          type: string
          maxLength: 500
    ChangeManagedUserTierRequest:
      type: object
      required:
        - tier
        - expectedRowVersion
      properties:
        tier:
          $ref: '#/components/schemas/TierLabel'
        expectedRowVersion:
          type: string
        reason:
          type: string
          maxLength: 500
          nullable: true
    CancelManagedUserRequest:
      type: object
      required:
        - expectedRowVersion
        - reason
      properties:
        expectedRowVersion:
          type: string
        reason:
          type: string
          maxLength: 500
    AdminActionResponse:
      type: object
      required:
        - row
      properties:
        row:
          $ref: '#/components/schemas/UserManagementRow'
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - correlationId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        correlationId:
          type: string