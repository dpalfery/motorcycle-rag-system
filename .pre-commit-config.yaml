repos:
  - repo: local
    hooks:
      - id: validate-agent-instructions
        name: Validate agent instruction hierarchy
        entry: bash 7-Deployment/scripts/validate-docs.sh
        language: system
        files: '(^|/)AGENTS\.md$|^6-Docs/(system|AzureEnvironment|MotorcycleRAG.AdminDesktop|local-processing-service)/|^7-Deployment/scripts/validate-docs\.sh$'
        pass_filenames: false
      - id: kyber-weave-validate
        name: Kyber-Weave Validate
        description: Run Kyber-Weave skill validate, lint, and scan on all skill directories
        entry: bash 7-Deployment/scripts/kyber-weave-validate.sh
        language: system
        files: '^(\.agents/skills/|\.claude/skills/|\.kilo/skills/|7-Deployment/scripts/kyber-weave-validate\.sh$|7-Deployment/tools/KyberWeave/|\.gitmodules$)'
        pass_filenames: false
        always_run: false
