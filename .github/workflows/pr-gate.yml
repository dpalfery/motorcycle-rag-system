name: PR Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Weekly CodeQL fallback — Monday 00:00 UTC (carried over from original codeql.yml)
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Phase 0 — path classification (~15s, ubuntu)
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.flags.outputs.code }}
      docs: ${{ steps.flags.outputs.docs }}
      infra: ${{ steps.flags.outputs.infra }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sln'
              - '2-Application/local-processing-service/**/*.py'
              - '5-Test/local-processing-service.Tests/**/*.py'
              - '1-Presentation/**/*.{ts,tsx}'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pyproject.toml'
              - '**/poetry.lock'
            docs:
              - '**/*.md'
              - '**/AGENTS.md'
              - '7-Deployment/scripts/validate-docs.sh'
              - '.markdownlint-cli2.yaml'
              - '7-Deployment/tools/SkillForge/src/SkillForge.Core/Docs/**'
              - '7-Deployment/tools/SkillForge/src/SkillForge.Cli/Commands/Docs/**'
            infra:
              - '.github/**'
              - '7-Deployment/**'

      # Aggregate flags: schedule/dispatch bypass path filter (no PR diff available)
      - name: Aggregate change flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
            echo "infra=${{ steps.filter.outputs.infra }}" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Phase 1 — build + unit tests (if code changed)
  # ─────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Unit Tests (Linux)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: 'MotorcycleRAG.sln'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 1-Presentation/MotorcycleRAG.AdminDesktop/package-lock.json

      - name: Restore dependencies
        run: dotnet restore MotorcycleRAG.sln

      - name: Install local processor test environment
        working-directory: 2-Application/local-processing-service
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Install shared test-script dependencies
        run: python -m pip install --requirement 5-Test/scripts/requirements.txt

      - name: Install Admin Desktop dependencies
        run: npm ci
        working-directory: 1-Presentation/MotorcycleRAG.AdminDesktop

      - name: Run unified unit coverage
        run: |
          python3 5-Test/scripts/run_unit_coverage.py \
            --results-dir TestResults/UnitCoverage \
            --configuration Release \
            --suite dotnet-unit \
            --suite python-unit \
            --suite admindesktop-unit

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-coverage-linux-results
          path: TestResults/UnitCoverage/
          retention-days: 14

      - name: Build solution for downstream jobs
        run: dotnet build MotorcycleRAG.sln --configuration Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          path: |
            0-Base/MotorcycleRAG.Core/bin/
            0-Base/MotorcycleRAG.Core/obj/
            1-Presentation/MotorcycleRAG.API/bin/
            1-Presentation/MotorcycleRAG.API/obj/
            1-Presentation/MotorcycleRag.WebUI.BFF/bin/
            1-Presentation/MotorcycleRag.WebUI.BFF/obj/
            2-Application/MotorcycleRAG.Application/bin/
            2-Application/MotorcycleRAG.Application/obj/
            3-Domain/MotorcycleRAG.Contracts/bin/
            3-Domain/MotorcycleRAG.Contracts/obj/
            3-Domain/MotorcycleRAG.Contracts.Models/bin/
            3-Domain/MotorcycleRAG.Contracts.Models/obj/
            3-Domain/MotorcycleRAG.Domain/bin/
            3-Domain/MotorcycleRAG.Domain/obj/
            4-Persistence/MotorcycleRAG.Persistence/bin/
            4-Persistence/MotorcycleRAG.Persistence/obj/
            5-Test/MotorcycleRAG.IntegrationTests/bin/
            5-Test/MotorcycleRAG.IntegrationTests/obj/
            5-Test/MotorcycleRAG.EndToEndTests/bin/
            5-Test/MotorcycleRAG.EndToEndTests/obj/
            7-Deployment/AgentProvisioning/bin/
            7-Deployment/AgentProvisioning/obj/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # Phase 1 — docs quality (if docs changed, parallel with build-test)
  # ─────────────────────────────────────────────────────────────────────
  docs-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2

      - name: Validate documentation catalog and structure
        run: bash 7-Deployment/scripts/validate-docs.sh

      # Schema tier of the documentation ontology (SF-DOC-SPEC-*). Needs no code
      # index, so it runs on every documentation change.
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate documentation frontmatter
        run: >-
          dotnet run --project 7-Deployment/tools/SkillForge/src/SkillForge.Cli
          -- docs validate . --format table

      - name: Check internal documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline --no-progress
            README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md
            1-Presentation/MotorcycleRAG.API/README.md
            1-Presentation/MotorcycleRAG.AdminDesktop/README.md
            1-Presentation/MotorcycleRAG.MobileApp/README.md
            1-Presentation/MotorcycleRag.WebUI/README.md
            1-Presentation/MotorcycleRag.WebUI.BFF/README.md
            2-Application/local-processing-service/README.md
            2-Application/MotorcycleRAG.Application/Services/Caching/README.md
            7-Deployment/README.md 7-Deployment/DbSetup/README.md
            7-Deployment/tools/SkillForge/README.md
            6-Docs/README.md 6-Docs/catalog.md 6-Docs/documentation-standard.md
            6-Docs/documentation-ontology.md
            6-Docs/system 6-Docs/MotorcycleRAG.API 6-Docs/MotorcycleRAG.AdminDesktop
            6-Docs/MotorcycleRAG.MobileApp 6-Docs/MotorcycleRag.WebUI
            6-Docs/MotorcycleRag.WebUI.BFF 6-Docs/operations
            6-Docs/local-processing-service 6-Docs/AzureEnvironment
            6-Docs/DevOps/README.md 6-Docs/DevOps/database-setup.md
            6-Docs/reference/README.md 6-Docs/reference/skillforge.md

      - name: Scan documentation changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────
  # Phase 2 — security gate (needs build-test success)
  # ─────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [changes, build-test]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, python, javascript-typescript]

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          db-location: ${{ runner.temp }}/codeql_databases

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: 'MotorcycleRAG.sln'

      - name: Build solution
        if: matrix.language == 'csharp'
        run: |
          dotnet restore MotorcycleRAG.sln
          dotnet build MotorcycleRAG.sln --configuration Release --no-restore

      # Python has no compiled build step, so nothing ever triggers extraction on its
      # own. github/codeql-action/autobuild only handles compiled languages (build-mode
      # autobuild) and is a no-op for Python ("None of the languages in this project
      # require extra build steps") — the extractor's own autobuild.sh must be traced
      # directly instead.
      - name: Extract Python source
        if: matrix.language == 'python'
        run: |
          set -euo pipefail
          codeql_dir="$(dirname "${{ steps.init.outputs.codeql-path }}")"
          "${{ steps.init.outputs.codeql-path }}" database trace-command \
            "${{ runner.temp }}/codeql_databases/python" \
            -- "$codeql_dir/python/tools/autobuild.sh"

      - name: Perform CodeQL Analysis
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:${{ matrix.language }}"

      # csharp/python run the raw CodeQL CLI instead of codeql-action/analyze so that
      # --model-packs can load .github/codeql/{csharp,python}-log-sanitizer-models — the
      # barrierModel data extensions that teach the log-injection/log-forging queries to
      # recognize LogSanitizer.Sanitize()/sanitize_log_value() as real sanitizers.
      # codeql-action's own `packs:`/`queries:` inputs only accept published registry
      # packs or local *query* packs; there is no supported way to pass an unpublished
      # local model pack through the managed `analyze` action.
      - name: Perform CodeQL Analysis with log-sanitizer model pack
        if: matrix.language == 'csharp' || matrix.language == 'python'
        run: |
          set -euo pipefail
          if [ "${{ matrix.language }}" = "csharp" ]; then
            MODEL_PACK="motorcyclerag/csharp-log-sanitizer-models"
            SUITE="codeql/csharp-queries:codeql-suites/csharp-security-extended.qls"
          else
            MODEL_PACK="motorcyclerag/python-log-sanitizer-models"
            SUITE="codeql/python-queries:codeql-suites/python-security-extended.qls"
          fi
          "${{ steps.init.outputs.codeql-path }}" database finalize \
            "${{ runner.temp }}/codeql_databases/${{ matrix.language }}"
          "${{ steps.init.outputs.codeql-path }}" database analyze \
            "${{ runner.temp }}/codeql_databases/${{ matrix.language }}" \
            "$SUITE" \
            --additional-packs="${{ github.workspace }}/.github/codeql" \
            --model-packs="$MODEL_PACK" \
            --format=sarif-latest \
            --sarif-category="/language:${{ matrix.language }}" \
            --output="${{ runner.temp }}/codeql-results-${{ matrix.language }}.sarif"

      - name: Upload CodeQL results
        if: matrix.language == 'csharp' || matrix.language == 'python'
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results-${{ matrix.language }}.sarif
          category: "/language:${{ matrix.language }}"

  trivy:
    name: Trivy OSS Security Scan
    runs-on: ubuntu-latest
    needs: [changes, build-test]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install verified Trivy CLI
        env:
          TRIVY_VERSION: '0.72.0'
          TRIVY_SHA256: 'bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea'
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/trivy/bin" trivy
          echo "$RUNNER_TEMP/trivy/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy/bin/trivy" --version

      # Scan once to JSON, then convert to both SARIF (for GitHub Security) and
      # table (for the job log). Scanning straight to SARIF leaves a failing job
      # with no findings printed anywhere in the log.
      - name: Scan repository with Trivy
        run: |
          trivy fs \
            --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy.json \
            --skip-dirs .git \
            --skip-dirs .kilo \
            --skip-dirs .opencode \
            --skip-dirs .pnpm-store \
            .

      - name: Convert Trivy report to SARIF
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format sarif --output trivy.sarif trivy.json

      # Prints every HIGH/CRITICAL finding, then fails the job if any exist.
      - name: Report Trivy findings
        if: always() && hashFiles('trivy.json') != ''
        run: trivy convert --format table --exit-code 1 trivy.json

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  semgrep:
    name: Semgrep Community SAST
    runs-on: ubuntu-latest
    needs: [changes, build-test]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "setuptools<82" semgrep==1.136.0

      - name: Scan repository with Semgrep
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude '.kilo/**' \
            --exclude '.opencode/**' \
            --exclude '.pnpm-store/**' \
            --exclude '**/wwwroot/assets/**' \
            --sarif-output semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─────────────────────────────────────────────────────────────────────
  # Phase 2 — IaC security scan (parallel with other Phase 2 jobs)
  # ─────────────────────────────────────────────────────────────────────
  iac-scan:
    name: "IaC Security Scan (Checkov)"
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.8

      - name: Run Checkov - Dockerfiles
        run: |
          checkov -d 7-Deployment \
            --framework dockerfile \
            --config-file 7-Deployment/scanning/.checkov.yaml \
            --output sarif \
            --output-file-path checkov-dockerfile.sarif
        continue-on-error: true

      - name: Run Checkov - GitHub Actions
        run: |
          checkov -d .github \
            --framework github_actions \
            --config-file 7-Deployment/scanning/.checkov.yaml \
            --output sarif \
            --output-file-path checkov-github-actions.sarif
        continue-on-error: true

      - name: Upload Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        if: always() && hashFiles('checkov-dockerfile.sarif') != ''
        with:
          sarif_file: checkov-dockerfile.sarif
          category: "checkov-dockerfile"

      - name: Upload GitHub Actions SARIF
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        if: always() && hashFiles('checkov-github-actions.sarif') != ''
        with:
          sarif_file: checkov-github-actions.sarif
          category: "checkov-github-actions"

  # ─────────────────────────────────────────────────────────────────────
  # Phase 3 — deep validation (needs security gate pass)
  # ─────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, build-test, codeql, trivy, semgrep]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Run integration tests
        run: |
          dotnet test 5-Test/MotorcycleRAG.IntegrationTests/MotorcycleRAG.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger trx \
            --results-directory TestResults/Integration \
            --filter "Category!=AzureIntegration"

      - name: Upload integration test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: integration-test-results
          path: TestResults/Integration/
          retention-days: 14

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [changes, build-test, codeql, trivy, semgrep]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    services:
      # Mock services for E2E testing without real Azure dependencies
      mockserver:
        image: mockserver/mockserver:latest
        ports:
          - 1080:1080

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Setup test data
        run: |
          mkdir -p 5-Test/MotorcycleRAG.EndToEndTests/TestData
          # Test data is created by TestDataManager during test execution

      - name: Run end-to-end tests
        run: |
          dotnet test 5-Test/MotorcycleRAG.EndToEndTests/MotorcycleRAG.EndToEndTests.csproj \
            --no-build \
            --configuration Release \
            --logger trx \
            --results-directory TestResults/EndToEnd \
            --filter "Category!=Integration"
        env:
          TestConfiguration__UseRealAzureServices: false
          TestConfiguration__MockServerUrl: http://localhost:1080

      - name: Upload E2E test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-test-results
          path: TestResults/EndToEnd/
          retention-days: 14

  skill-gate:
    name: SkillForge Skill Gate
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: Remove continue-on-error once all skills pass SkillForge validation
    needs: [changes, build-test, codeql, trivy, semgrep]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build SkillForge
        run: dotnet build 7-Deployment/tools/SkillForge/src/SkillForge.Cli/SkillForge.Cli.csproj -c Release

      - name: Validate .agents/skills
        run: dotnet run --project 7-Deployment/tools/SkillForge/src/SkillForge.Cli -c Release --no-build -- validate .agents/skills --format table

      - name: Lint .agents/skills
