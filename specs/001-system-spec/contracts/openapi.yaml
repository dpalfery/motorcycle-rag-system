openapi: 3.0.3
info:
  title: Motorcycle RAG System API
  version: 1.0.0
  description: |
    Contract derived from specs/001-system-spec/spec.md.
    Note: Some endpoints already exist; others are planned.
servers:
  - url: https://localhost:44306
paths:
  /health:
    get:
      summary: Overall health
      responses:
        '200':
          description: Health status
  /api/motorcycles/query:
    post:
      summary: Query motorcycle information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotorcycleQueryRequest'
      responses:
        '200':
          description: Query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleQueryResponse'
        '400':
          description: Validation error
        '401':
          description: Not authenticated
        '429':
          description: Rate limited / daily plan limit exceeded
  /api/motorcycles/health:
    get:
      summary: RAG service health
      responses:
        '200':
          description: Health status
  /api/DataPipeline/upload:
    post:
      summary: Upload a single file for processing
      parameters:
        - in: query
          name: processImmediately
          schema:
            type: boolean
          required: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload result (or upload+processing)
        '400':
          description: Validation error
  /api/DataPipeline/upload-batch:
    post:
      summary: Upload multiple files
      parameters:
        - in: query
          name: processImmediately
          schema:
            type: boolean
          required: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Batch upload result
  /api/DataPipeline/process:
    post:
      summary: Process a previously uploaded file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataPipelineRequest'
      responses:
        '200':
          description: Pipeline execution result
  /api/DataPipeline/process-batch:
    post:
      summary: Process multiple files in batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DataPipelineRequest'
      responses:
        '200':
          description: Batch pipeline result
  /api/DataPipeline/status/{executionId}:
    get:
      summary: Get pipeline status
      parameters:
        - in: path
          name: executionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pipeline status
  /api/DataPipeline/metrics:
    get:
      summary: Get pipeline metrics
      parameters:
        - in: query
          name: hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 168
      responses:
        '200':
          description: Pipeline metrics
  /api/DataPipeline/cancel/{executionId}:
    post:
      summary: Cancel pipeline execution
      parameters:
        - in: path
          name: executionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation result
  /api/DataPipeline/scheduled/execute:
    post:
      summary: Trigger immediate scheduled run
      responses:
        '200':
          description: Execution result
  /api/DataPipeline/scheduled/stats:
    get:
      summary: Scheduled processing stats
      responses:
        '200':
          description: Stats
  /api/DataPipeline/health:
    get:
      summary: Pipeline health
      responses:
        '200':
          description: Health status
  /api/DataPipeline/upload/constraints:
    get:
      summary: Upload constraints
      responses:
        '200':
          description: Constraints
  /api/admin/web-sources:
    get:
      summary: List approved web sources
      responses:
        '200':
          description: Web sources
    post:
      summary: Add a web source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSource'
      responses:
        '201':
          description: Created
  /api/admin/web-sources/{webSourceId}:
    patch:
      summary: Update/disable a web source
      parameters:
        - in: path
          name: webSourceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSource'
      responses:
        '200':
          description: Updated
    delete:
      summary: Remove a web source
      parameters:
        - in: path
          name: webSourceId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /api/admin/mcp-tools:
    get:
      summary: List MCP tool definitions (managed via MAUI admin app)
      responses:
        '200':
          description: Tools
    post:
      summary: Create a tool definition (managed via MAUI admin app)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDefinition'
      responses:
        '201':
          description: Created
  /api/admin/mcp-tools/{toolId}:
    patch:
      summary: Update/enable/disable a tool (managed via MAUI admin app)
      parameters:
        - in: path
          name: toolId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolDefinition'
      responses:
        '200':
          description: Updated

  /api/admin/mcp-config:
    get:
      summary: Get active MCP configuration version
      responses:
        '200':
          description: Active configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpConfigurationVersion'

  /api/admin/mcp-config/activate:
    post:
      summary: Activate an MCP configuration version (live-update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configVersionId]
              properties:
                configVersionId:
                  type: string
      responses:
        '200':
          description: Activated
  /api/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /api/me/usage:
    get:
      summary: Get current usage and plan limits
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatus'
components:
  schemas:
    MotorcycleQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 1000
        userId:
          type: string
        preferences:
          type: object
          properties:
            includeWebSources:
              type: boolean
            includePDFSources:
              type: boolean
            maxResults:
              type: integer
              minimum: 1
              maximum: 100
            minRelevanceScore:
              type: number
              minimum: 0
              maximum: 1
        context:
          type: object
          properties:
            sessionId:
              type: string
            correlationId:
              type: string
    MotorcycleQueryResponse:
      type: object
      required: [response, queryId]
      properties:
        response:
          type: string
        queryId:
          type: string
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        metrics:
          type: object
        claims:
          type: array
          description: Optional structured claims (recommended for verification + citation linking)
          items:
            $ref: '#/components/schemas/Claim'
        citations:
          type: array
          description: Optional structured citations (recommended)
          items:
            $ref: '#/components/schemas/Citation'
        verification:
          type: array
          description: Optional verification results per claim (recommended)
          items:
            $ref: '#/components/schemas/VerificationResult'
    SearchResult:
      type: object
      required: [id, content, relevanceScore, source]
      properties:
        id:
          type: string
        content:
          type: string
        relevanceScore:
          type: number
        source:
          $ref: '#/components/schemas/SearchSource'
        metadata:
          type: object
        generatedAt:
          type: string
          format: date-time
        highlights:
          type: array
          items:
            type: string
    SearchSource:
      type: object
      required: [agentType, sourceName]
      properties:
        agentType:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        documentId:
          type: string
        lastUpdated:
          type: string
          format: date-time
    DataPipelineRequest:
      type: object
      required: [fileName, filePath, fileType]
      properties:
        id:
          type: string
        fileName:
          type: string
        filePath:
          type: string
        fileType:
          type: string
          enum: [CSV, PDF, Unknown]
        options:
          type: object
          properties:
            processImages:
              type: boolean
            generateEmbeddings:
              type: boolean
            indexImmediately:
              type: boolean
    WebSource:
      type: object
      required: [url]
      properties:
        webSourceId:
          type: string
        url:
          type: string
        isEnabled:
          type: boolean
        notes:
          type: string
    ToolDefinition:
      type: object
      required: [name]
      properties:
        toolId:
          type: string
        serverId:
          type: string
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        config:
          type: object
    McpConfigurationVersion:
      type: object
      required: [configVersionId, version, status]
      properties:
        configVersionId:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [Draft, Active, Archived]
        createdAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true
        activatedByUserId:
          type: string
          nullable: true
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        planSku:
          type: string
          enum: [Free, Plus, Pro]
    UsageStatus:
      type: object
      required: [planSku]
      properties:
        planSku:
          type: string
          enum: [Free, Plus, Pro]
        usageDateUtc:
          type: string
          format: date
        requestCount:
          type: integer
        dailyRequestLimit:
          type: integer
          nullable: true
          description: Daily limit expressed as requests per day (null when unlimited).
        dailyLimit:
          type: integer
          nullable: true
          deprecated: true
          description: Deprecated. Use dailyRequestLimit. Value is requests per day.
        isUnlimited:
          type: boolean
    Claim:
      type: object
      required: [claimId, text]
      properties:
        claimId:
          type: string
        text:
          type: string
    Citation:
      type: object
      required: [citationId, sourceType, locator]
      properties:
        citationId:
          type: string
        sourceType:
          type: string
          enum: [ManualPdf, Website, Dataset]
        locator:
          type: object
        excerpt:
          type: string
    VerificationResult:
      type: object
      required: [claimId, status]
      properties:
        claimId:
          type: string
        status:
          type: string
          enum: [Supported, Unsupported, Conflicting, InsufficientEvidence]
        rationale:
          type: string
        supportingCitationIds:
          type: array
          items:
            type: string
