config:
  MD013: false
  MD024: false
  MD033: false
  MD041: false
  # Ontology frontmatter carries a `title:` key as graph metadata, not as the
  # document's heading. Without this, MD025 counts that key as the first H1 and
  # reports every document's real `#` heading as a duplicate.
  MD025:
    front_matter_title: ""
globs:
  - "README.md"
  - "AGENTS.md"
  - "**/AGENTS.md"
  - "CONTRIBUTING.md"
  - "CODE_OF_CONDUCT.md"
  - "SECURITY.md"
  - "SUPPORT.md"
  - "1-Presentation/MotorcycleRAG.API/README.md"
  - "1-Presentation/MotorcycleRAG.AdminDesktop/README.md"
  - "1-Presentation/MotorcycleRAG.MobileApp/README.md"
  - "1-Presentation/MotorcycleRag.WebUI/README.md"
  - "1-Presentation/MotorcycleRag.WebUI.BFF/README.md"
  - "2-Application/local-processing-service/README.md"
  - "7-Deployment/README.md"
  - "6-Docs/README.md"
  - "6-Docs/catalog.md"
  - "6-Docs/documentation-standard.md"
  - "6-Docs/documentation-ontology.md"
  - "6-Docs/system/**/*.md"
  - "6-Docs/MotorcycleRAG.API/**/*.md"
  - "6-Docs/MotorcycleRAG.AdminDesktop/**/*.md"
  - "6-Docs/MotorcycleRAG.MobileApp/**/*.md"
  - "6-Docs/MotorcycleRag.WebUI/**/*.md"
  - "6-Docs/MotorcycleRag.WebUI.BFF/**/*.md"
  - "6-Docs/operations/**/*.md"
  - "6-Docs/local-processing-service/**/*.md"
  - "6-Docs/AzureEnvironment/**/*.md"
  - "6-Docs/DevOps/README.md"
  - "6-Docs/DevOps/database-setup.md"
  - "6-Docs/reference/README.md"
  - "6-Docs/reference/skillforge.md"
  - "2-Application/MotorcycleRAG.Application/Services/Caching/README.md"
ignores:
  - ".git/**"
  - ".kilo/**"
  - "**/node_modules/**"
