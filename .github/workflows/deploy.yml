name: Build & Deploy to Azure

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: pulumi-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20.x"
  PULUMI_STACK: "dev"
  PULUMI_WORK_DIR: "7-Deployment/infrastructure"

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── Source ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend build (no Azure deps, run early to fail fast) ─────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build React UI
        run: |
          cd 1-Presentation/MotorcycleRag.WebUI
          npm install
          npm run build

      - name: Copy UI Assets to BFF
        run: |
          mkdir -p 1-Presentation/MotorcycleRag.WebUI.BFF/wwwroot
          cp -r 1-Presentation/MotorcycleRag.WebUI/dist/* 1-Presentation/MotorcycleRag.WebUI.BFF/wwwroot/

      # ── .NET (needed for Pulumi C# runtime) ────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Azure Auth ─────────────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # ── Pulumi Up (creates ACR and all infrastructure) ─────────────
      - name: Pulumi Up
        uses: pulumi/actions@v4
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: ${{ env.PULUMI_WORK_DIR }}
          refresh: false
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_PULUMI }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY_PULUMI }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Read Pulumi outputs into env vars ──────────────────────────
      - name: Read Pulumi Outputs
        run: |
          cd ${{ env.PULUMI_WORK_DIR }}
          ACR_LOGIN_SERVER=$(pulumi stack output acrLoginServer --stack ${{ env.PULUMI_STACK }})
          RG=$(pulumi stack output resourceGroupName --stack ${{ env.PULUMI_STACK }})
          API_APP=$(pulumi stack output apiAppName --stack ${{ env.PULUMI_STACK }})
          UI_APP=$(pulumi stack output uiAppName --stack ${{ env.PULUMI_STACK }})
          ACR_NAME="${ACR_LOGIN_SERVER%.azurecr.io}"

          SQL_SERVER=$(pulumi stack output sqlServerName --stack ${{ env.PULUMI_STACK }})
          SQL_DATABASE=$(pulumi stack output sqlDatabaseName --stack ${{ env.PULUMI_STACK }})

          echo "ACR_LOGIN_SERVER=${ACR_LOGIN_SERVER}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${ACR_NAME}"                 >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=${RG}"                 >> "$GITHUB_ENV"
          echo "API_APP_NAME=${API_APP}"              >> "$GITHUB_ENV"
          echo "UI_APP_NAME=${UI_APP}"                >> "$GITHUB_ENV"
          FOUNDRY_ENDPOINT=$(pulumi stack output foundryProjectEndpoint --stack ${{ env.PULUMI_STACK }})
          ORCHESTRATOR_MODEL_DEPLOYMENTS=$(pulumi stack output orchestratorModelDeploymentCandidates --stack ${{ env.PULUMI_STACK }})
          SUBAGENT_MODEL_DEPLOYMENT=$(pulumi stack output subAgentModelDeploymentName --stack ${{ env.PULUMI_STACK }})
          KEY_VAULT_URI=$(pulumi stack output keyVaultUri --stack ${{ env.PULUMI_STACK }})
          KEY_VAULT_NAME="${KEY_VAULT_URI#https://}"
          KEY_VAULT_NAME="${KEY_VAULT_NAME%.vault.azure.net}"
          KEY_VAULT_NAME="${KEY_VAULT_NAME%.vault.azure.net/}"

          echo "SQL_SERVER=${SQL_SERVER}"             >> "$GITHUB_ENV"
          echo "SQL_DATABASE=${SQL_DATABASE}"         >> "$GITHUB_ENV"
          echo "FOUNDRY_ENDPOINT=${FOUNDRY_ENDPOINT}" >> "$GITHUB_ENV"
          echo "ORCHESTRATOR_MODEL_DEPLOYMENTS=${ORCHESTRATOR_MODEL_DEPLOYMENTS}" >> "$GITHUB_ENV"
          echo "SUBAGENT_MODEL_DEPLOYMENT=${SUBAGENT_MODEL_DEPLOYMENT}" >> "$GITHUB_ENV"
          echo "KEY_VAULT_NAME=${KEY_VAULT_NAME}"     >> "$GITHUB_ENV"
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_PULUMI }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY_PULUMI }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Run DB schema migrations (idempotent IF NOT EXISTS guards) ──
      - name: Run Database Schema Migrations
        run: |
          # ubuntu-latest runners ship mssql-tools18; use it directly.
          # Fall back to mssql-tools (older path) if 18 is absent.
          SQLCMD=""
          for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
            if [ -x "$candidate" ]; then SQLCMD="$candidate"; break; fi
          done
          if [ -z "$SQLCMD" ]; then
            echo "sqlcmd not found; installing mssql-tools18..."
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q mssql-tools18 unixodbc-dev
            SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
          fi

          "$SQLCMD" \
            -S "${{ env.SQL_SERVER }}.database.windows.net,1433" \
            -d "${{ env.SQL_DATABASE }}" \
            -U "${{ secrets.SQL_ADMIN_LOGIN }}" \
            -P "${{ secrets.SQL_ADMIN_PASSWORD }}" \
            -N -C \
            -i "4-Persistence/MotorcycleRAG.Persistence/Sql/schema.sql" \
            -b
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}

      # ── ACR Login (ACR guaranteed to exist after Pulumi) ───────────
      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # ── Docker Build & Push ────────────────────────────────────────
      - name: Build & Push Docker Images
        run: |
          SHA_TAG="${{ github.sha }}"
          API_IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-api:latest"
          API_IMAGE_SHA="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-api:${SHA_TAG}"
          UI_IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-ui:latest"
          UI_IMAGE_SHA="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-ui:${SHA_TAG}"

          docker build -t "${API_IMAGE_LATEST}" -t "${API_IMAGE_SHA}" -f 7-Deployment/Dockerfile.api .
          docker push "${API_IMAGE_LATEST}"
          docker push "${API_IMAGE_SHA}"

          docker build -t "${UI_IMAGE_LATEST}" -t "${UI_IMAGE_SHA}" -f 7-Deployment/Dockerfile.ui .
          docker push "${UI_IMAGE_LATEST}"
          docker push "${UI_IMAGE_SHA}"

      # ── Force new Container App revisions to pull fresh images ─────
      - name: Update Container App Revisions
        run: |
          SHA_TAG="${{ github.sha }}"
          API_IMAGE_SHA="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-api:${SHA_TAG}"
          UI_IMAGE_SHA="${{ env.ACR_LOGIN_SERVER }}/motorcycle-rag-ui:${SHA_TAG}"

          az containerapp update \
            --name "${{ env.API_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${API_IMAGE_SHA}"

          az containerapp update \
            --name "${{ env.UI_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${UI_IMAGE_SHA}"

      # ── Provision Foundry Agents ────────────────────────────────────
      - name: Provision Foundry Agents
        id: provision-agents
        run: |
          set -euo pipefail
          AGENT_PROVISIONING_LOG="$(mktemp)"

          set +e
          dotnet run --project 7-Deployment/AgentProvisioning -- 2>&1 | tee "${AGENT_PROVISIONING_LOG}"
          DOTNET_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${DOTNET_STATUS}" -ne 0 ]; then
            echo "Agent provisioning CLI failed. Full output is shown above."
            exit "${DOTNET_STATUS}"
          fi

          AGENT_REFS_JSON=$(grep -E '^\{.*"orchestratorAgentName".*\}$' "${AGENT_PROVISIONING_LOG}" | tail -n 1)
          if [ -z "${AGENT_REFS_JSON}" ]; then
            echo "Agent provisioning CLI completed but did not emit the expected JSON output."
            exit 1
          fi

          ORCHESTRATOR_AGENT_NAME=$(echo "${AGENT_REFS_JSON}" | jq -er '.orchestratorAgentName')
          ORCHESTRATOR_AGENT_VERSION=$(echo "${AGENT_REFS_JSON}" | jq -er '.orchestratorAgentVersion')
          VECTORSEARCH_AGENT_NAME=$(echo "${AGENT_REFS_JSON}" | jq -er '.vectorSearchAgentName')
          VECTORSEARCH_AGENT_VERSION=$(echo "${AGENT_REFS_JSON}" | jq -er '.vectorSearchAgentVersion')
          WEBSEARCH_AGENT_NAME=$(echo "${AGENT_REFS_JSON}" | jq -er '.webSearchAgentName')
          WEBSEARCH_AGENT_VERSION=$(echo "${AGENT_REFS_JSON}" | jq -er '.webSearchAgentVersion')
          PDFSEARCH_AGENT_NAME=$(echo "${AGENT_REFS_JSON}" | jq -er '.pdfSearchAgentName')
          PDFSEARCH_AGENT_VERSION=$(echo "${AGENT_REFS_JSON}" | jq -er '.pdfSearchAgentVersion')

          for agent_ref in \
            "${ORCHESTRATOR_AGENT_NAME}" \
            "${ORCHESTRATOR_AGENT_VERSION}" \
            "${VECTORSEARCH_AGENT_NAME}" \
            "${VECTORSEARCH_AGENT_VERSION}" \
            "${WEBSEARCH_AGENT_NAME}" \
            "${WEBSEARCH_AGENT_VERSION}" \
            "${PDFSEARCH_AGENT_NAME}" \
            "${PDFSEARCH_AGENT_VERSION}"; do
            if [ -z "${agent_ref}" ] || [ "${agent_ref}" = "null" ]; then
              echo "Agent provisioning returned an empty agent reference"
              exit 1
            fi
          done

          echo "ORCHESTRATOR_AGENT_NAME=${ORCHESTRATOR_AGENT_NAME}" >> "$GITHUB_ENV"
          echo "ORCHESTRATOR_AGENT_VERSION=${ORCHESTRATOR_AGENT_VERSION}" >> "$GITHUB_ENV"
          echo "VECTORSEARCH_AGENT_NAME=${VECTORSEARCH_AGENT_NAME}" >> "$GITHUB_ENV"
          echo "VECTORSEARCH_AGENT_VERSION=${VECTORSEARCH_AGENT_VERSION}" >> "$GITHUB_ENV"
          echo "WEBSEARCH_AGENT_NAME=${WEBSEARCH_AGENT_NAME}" >> "$GITHUB_ENV"
          echo "WEBSEARCH_AGENT_VERSION=${WEBSEARCH_AGENT_VERSION}" >> "$GITHUB_ENV"
          echo "PDFSEARCH_AGENT_NAME=${PDFSEARCH_AGENT_NAME}" >> "$GITHUB_ENV"
          echo "PDFSEARCH_AGENT_VERSION=${PDFSEARCH_AGENT_VERSION}" >> "$GITHUB_ENV"
        env:
          AZURE_FOUNDRY_ENDPOINT: ${{ env.FOUNDRY_ENDPOINT }}
          ORCHESTRATOR_MODEL_DEPLOYMENTS: ${{ env.ORCHESTRATOR_MODEL_DEPLOYMENTS }}
          SUBAGENT_MODEL_DEPLOYMENT: ${{ env.SUBAGENT_MODEL_DEPLOYMENT }}

      # ── Write Agent References to Key Vault ────────────────────────
      - name: Write Agent References to Key Vault
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-ORCHESTRATOR-AGENT-NAME" --value "${{ env.ORCHESTRATOR_AGENT_NAME }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-ORCHESTRATOR-AGENT-VERSION" --value "${{ env.ORCHESTRATOR_AGENT_VERSION }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-VECTORSEARCH-AGENT-NAME" --value "${{ env.VECTORSEARCH_AGENT_NAME }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-VECTORSEARCH-AGENT-VERSION" --value "${{ env.VECTORSEARCH_AGENT_VERSION }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-WEBSEARCH-AGENT-NAME" --value "${{ env.WEBSEARCH_AGENT_NAME }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-WEBSEARCH-AGENT-VERSION" --value "${{ env.WEBSEARCH_AGENT_VERSION }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-PDFSEARCH-AGENT-NAME" --value "${{ env.PDFSEARCH_AGENT_NAME }}"
          az keyvault secret set --vault-name "${{ env.KEY_VAULT_NAME }}" --name "MCR-PDFSEARCH-AGENT-VERSION" --value "${{ env.PDFSEARCH_AGENT_VERSION }}"
