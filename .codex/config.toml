sandbox_mode = "danger-full-access"

# Project-scoped MCP registrations imported from .mcp.json and installed VS Code MCP extensions.
# Agents narrow these registrations in .codex/agents/*.toml for context slimming.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

# Azure MCP is available locally via the recommended VS Code extension.
# Kept read-only to honor AGENTS.md: Azure access is diagnostic/read-only for agents.
[mcp_servers.azure]
command = "/Users/dave/.vscode-insiders/extensions/ms-azuretools.vscode-azure-mcp-server-3.0.20-darwin-arm64/server/azmcp"
args = ["server", "start", "--mode", "namespace", "--read-only"]
default_tools_approval_mode = "prompt"

[mcp_servers.azure.env]
DOTNET_BUNDLE_EXTRACT_BASE_DIR = "/private/tmp"
AZURE_MCP_COLLECT_TELEMETRY = "false"

[agents]
max_depth = 2
max_threads = 6

[agents."conductor-v2"]
config_file = ".codex/agents/conductor-v2.toml"
description = "Primary orchestration agent imported from the canonical .opencode swarm."
nickname_candidates = ["Conductor", "PM", "Coordinator"]

[agents.architect]
config_file = ".codex/agents/architect.toml"
description = "Technical planning agent that resolves design questions and produces implementation-ready plans."
nickname_candidates = ["Architect", "Planner", "Analyst"]

[agents."azure-reader"]
config_file = ".codex/agents/azure-reader.toml"
description = "Read-only Azure investigation agent."
nickname_candidates = ["Azure Reader", "Cloud Reader", "Azure Scout"]

[agents."code-reviewer"]
config_file = ".codex/agents/code-reviewer.toml"
description = "Strict code reviewer and quality gate."
nickname_candidates = ["Reviewer", "Code Review", "Critic"]

[agents."product-owner"]
config_file = ".codex/agents/product-owner.toml"
description = "Single-owner spec planning agent."
nickname_candidates = ["Product Owner", "PO", "Spec Planner"]
[agents."dotnet-dev"]
config_file = ".codex/agents/dotnet-dev.toml"
description = "Exclusive owner of .NET and ASP.NET Core backend implementation."
nickname_candidates = ["Dotnet Dev", ".NET Dev", "Backend Dev"]

[agents."frontend-dev"]
config_file = ".codex/agents/frontend-dev.toml"
description = "Frontend implementation specialist for React and UI work."
nickname_candidates = ["Frontend Dev", "UI Dev", "Web Dev"]

[agents."maui-dev"]
config_file = ".codex/agents/maui-dev.toml"
description = "MAUI client implementation specialist."
nickname_candidates = ["MAUI Dev", "Client Dev", "App Dev"]

[agents."python-dev"]
config_file = ".codex/agents/python-dev.toml"
description = "Python implementation specialist."
nickname_candidates = ["Python Dev", "Py Dev", "Processor Dev"]

