# Sample: Kyber-Weave docs validate / drift
#
# Copy to .github/workflows/ and replace PIN placeholders.
# docs drift requires a CodeGraph index at .codegraph/codegraph.db
# (CodeGraph is host-owned; see README.md).

name: Kyber-Weave Docs Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PIN: published KyberWeave.Tool SemVer — replace before production use
  KYBER_WEAVE_VERSION: "0.1.0"
  # PIN: SDK band matching the tool TFM (net10.0 → 10.0.x)
  DOTNET_VERSION: "10.0.x"
  # Leave empty for nuget.org; set for a private feed (see README).
  KYBER_WEAVE_NUGET_SOURCE: ""
  # Documentation root relative to the repository root (--docs-root).
  # Override to match the host (e.g. "6-Docs" or "docs").
  DOCS_ROOT: "docs"
  PROJECT_ROOT: "."

jobs:
  docs-validate:
    name: Docs validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Kyber-Weave NuGet source
        if: ${{ env.KYBER_WEAVE_NUGET_SOURCE != '' }}
        run: >
          dotnet nuget add source "${{ env.KYBER_WEAVE_NUGET_SOURCE }}"
          --name kyber-weave
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_AUTH_TOKEN }}"
          --store-password-in-clear-text

      - name: Install Kyber-Weave tool (pinned)
        run: >
          dotnet tool install --global KyberWeave.Tool
          --version "${{ env.KYBER_WEAVE_VERSION }}"

      - name: Validate documentation frontmatter
        run: >
          kyber-weave docs validate "${{ env.PROJECT_ROOT }}"
          --docs-root "${{ env.DOCS_ROOT }}"
          --format table

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Kyber-Weave NuGet source
        if: ${{ env.KYBER_WEAVE_NUGET_SOURCE != '' }}
        run: >
          dotnet nuget add source "${{ env.KYBER_WEAVE_NUGET_SOURCE }}"
          --name kyber-weave
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_AUTH_TOKEN }}"
          --store-password-in-clear-text

      - name: Install Kyber-Weave tool (pinned)
        run: >
          dotnet tool install --global KyberWeave.Tool
          --version "${{ env.KYBER_WEAVE_VERSION }}"

      # Host-owned: ensure .codegraph/codegraph.db exists before drift.
      # Example (adapt to your CodeGraph install):
      #   - uses: actions/setup-node@...
      #   - run: npm ci && npx codegraph sync .
      # Or restore a cached .codegraph directory from a previous job.
      - name: Require CodeGraph index
        run: |
          set -euo pipefail
          if [ ! -f .codegraph/codegraph.db ]
          then
            echo "::error::Missing .codegraph/codegraph.db. Build or restore a CodeGraph index before docs drift."
            exit 1
          fi

      - name: Verify documentation entity drift
        run: >
          kyber-weave docs drift "${{ env.PROJECT_ROOT }}"
          --docs-root "${{ env.DOCS_ROOT }}"
          --format table
