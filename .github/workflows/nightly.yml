name: Nightly Tests & Security Scans

on:
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: 'Run load tests'
        required: false
        default: 'false'
        type: boolean
      run_integration_tests:
        description: 'Run integration tests with real Azure services'
        required: false
        default: 'false'
        type: boolean

# Nightly runs should complete — do not cancel in-progress runs.
# Group by schedule trigger so test and scan runs are independent.
concurrency:
  group: nightly-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  DOTNET_VERSION: '10.0.x'

# ---------------------------------------------------------------------------
# Condition helpers — tests run on 2 AM schedule + manual; scans on 3 AM + manual
# ---------------------------------------------------------------------------
# github.event.schedule contains the cron expression that triggered the run.

jobs:
  # ===========================================================================
  # TEST JOBS (triggered by 2 AM schedule or workflow_dispatch)
  # ===========================================================================

  unit-coverage-linux:
    name: Unit Coverage (Linux)
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 1-Presentation/MotorcycleRAG.AdminDesktop/package-lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Install local processor test environment
      working-directory: 2-Application/local-processing-service
      run: |
        python -m pip install --upgrade pip poetry
        poetry config virtualenvs.in-project true
        poetry install --with dev --no-root --no-interaction --no-ansi

    - name: Install shared test-script dependencies
      run: python -m pip install --requirement 5-Test/scripts/requirements.txt

    - name: Install Admin Desktop dependencies
      run: npm ci
      working-directory: 1-Presentation/MotorcycleRAG.AdminDesktop

    - name: Run unified unit coverage
      run: |
        python3 5-Test/scripts/run_unit_coverage.py \
          --results-dir TestResults/UnitCoverage \
          --configuration Release \
          --suite dotnet-unit \
          --suite python-unit \
          --suite admindesktop-unit

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: unit-coverage-linux-results
        path: TestResults/UnitCoverage/

  unit-tests:
    name: Unit Coverage Gate
    runs-on: ubuntu-latest
    needs:
      - unit-coverage-linux

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Install shared test-script dependencies
      run: python -m pip install --requirement 5-Test/scripts/requirements.txt

    - name: Download Linux coverage artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: unit-coverage-linux-results
        path: TestResults/UnitCoverage

    - name: Aggregate merged coverage and enforce threshold
      run: |
        python3 5-Test/scripts/aggregate_coverage.py \
          --results-dir TestResults/UnitCoverage \
          --output-dir TestResults/UnitCoverage/CoverageReport \
          --suite dotnet-unit \
          --suite python-unit \
          --suite admindesktop-unit

    - name: Upload merged coverage artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: unit-coverage-merged-results
        path: TestResults/UnitCoverage/CoverageReport/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        files: TestResults/UnitCoverage/CoverageReport/coverage-merged.cobertura.xml
        flags: unittests
        name: unit-tests-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run integration tests
      run: |
        dotnet test 5-Test/MotorcycleRAG.IntegrationTests/MotorcycleRAG.IntegrationTests.csproj \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory TestResults/Integration \
          --filter "Category!=AzureIntegration"

    - name: Upload integration test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: integration-test-results
        path: TestResults/Integration/

  end-to-end-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      # Mock services for E2E testing without real Azure dependencies
      mockserver:
        image: mockserver/mockserver:latest
        ports:
          - 1080:1080

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Setup test data
      run: |
        mkdir -p 5-Test/MotorcycleRAG.EndToEndTests/TestData
        # Test data is created by TestDataManager during test execution

    - name: Run end-to-end tests
      run: |
        dotnet test 5-Test/MotorcycleRAG.EndToEndTests/MotorcycleRAG.EndToEndTests.csproj \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory TestResults/EndToEnd \
          --filter "Category!=Integration"
      env:
        TestConfiguration__UseRealAzureServices: false
        TestConfiguration__MockServerUrl: http://localhost:1080

    - name: Upload E2E test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: e2e-test-results
        path: TestResults/EndToEnd/

  azure-integration-tests:
    name: Azure Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: (github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch') && (github.event.inputs.run_integration_tests == 'true' || github.event_name == 'schedule')
    environment: testing

    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Azure Login
      uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run Azure integration tests
      run: |
        dotnet test 5-Test/MotorcycleRAG.IntegrationTests/MotorcycleRAG.IntegrationTests.csproj \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory TestResults/AzureIntegration \
          --filter "Category=Integration"
      env:
        TestConfiguration__UseRealAzureServices: true
        AzureAI__FoundryEndpoint: ${{ secrets.AZURE_AI_FOUNDRY_ENDPOINT }}
        AzureAI__OpenAIEndpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AzureAI__SearchServiceEndpoint: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
        AzureAI__DocumentIntelligenceEndpoint: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}

    - name: Upload Azure integration test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: azure-integration-test-results
        path: TestResults/AzureIntegration/

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: end-to-end-tests
    if: (github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch') && (github.event.inputs.run_load_tests == 'true' || github.event_name == 'schedule')

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Start application for load testing
      run: |
        dotnet run --project 1-Presentation/MotorcycleRAG.API/MotorcycleRAG.API.csproj \
          --configuration Release &
        sleep 30  # Wait for application to start
      env:
        ASPNETCORE_ENVIRONMENT: Testing
        TestConfiguration__UseRealAzureServices: false

    - name: Run load tests
      run: |
        dotnet test 5-Test/MotorcycleRAG.LoadTests/MotorcycleRAG.LoadTests.csproj \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory TestResults/LoadTests
      env:
        LoadTest__BaseUrl: http://localhost:5000
        LoadTest__Duration: "00:03:00"  # Shorter duration for CI
        LoadTest__ConcurrentUsers: 20   # Reduced for CI environment

    - name: Upload load test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: load-test-results
        path: TestResults/LoadTests/

    - name: Upload NBomber reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: nbomber-reports
        path: 5-Test/MotorcycleRAG.LoadTests/load-test-results/

  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: [end-to-end-tests, load-tests]
    if: always() && (github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch') && (needs.load-tests.result == 'success' || needs.load-tests.result == 'skipped')

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Download test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: TestResults/

    - name: Analyze performance metrics
      run: |
        # Create performance analysis script
        cat > analyze_performance.py << 'EOF'
        import json
        import os
        import sys
        from pathlib import Path

        def analyze_test_results():
            results_dir = Path("TestResults")
            performance_issues = []

            # Analyze E2E test results for response times
            e2e_results = results_dir / "e2e-test-results"
            if e2e_results.exists():
                print("Analyzing E2E test performance...")
                # Parse TRX files and extract timing data
                # This would be implemented based on actual test result format

            # Analyze load test results
            load_results = results_dir / "load-test-results"
            if load_results.exists():
                print("Analyzing load test performance...")
                # Parse NBomber results and check against thresholds

            # Generate performance report
            report = {
                "timestamp": "2024-01-01T00:00:00Z",
                "performance_issues": performance_issues,
                "recommendations": [
                    "Monitor response times under load",
                    "Optimize database queries if needed",
                    "Consider caching for frequently accessed data"
                ]
            }

            with open("performance-report.json", "w") as f:
                json.dump(report, f, indent=2)

            print("Performance analysis complete")
            return len(performance_issues) == 0

        if __name__ == "__main__":
            success = analyze_test_results()
            sys.exit(0 if success else 1)
        EOF

        python analyze_performance.py

    - name: Upload performance report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: performance-report
        path: performance-report.json

  skill-gate:
    name: Kyber-Weave Skill Gate
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: Remove continue-on-error once all skills pass Kyber-Weave validation
    needs: unit-tests

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        submodules: true

    - name: Setup .NET 10
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - name: Build Kyber-Weave
      run: dotnet build 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli/KyberWeave.Cli.csproj -c Release

    - name: Validate .agents/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill validate .agents/skills --format table

    - name: Lint .agents/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill lint .agents/skills --min-desc-score 70 --format table

    - name: Scan .agents/skills (SARIF)
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill scan .agents/skills --fail-on critical --format sarif > kyber-weave-agents.sarif

    - name: Upload .agents/skills SARIF
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      with:
        sarif_file: kyber-weave-agents.sarif
        category: kyber-weave-agents

    - name: Validate .claude/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill validate .claude/skills --format table

    - name: Lint .claude/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill lint .claude/skills --min-desc-score 70 --format table

    - name: Scan .claude/skills (SARIF)
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill scan .claude/skills --fail-on critical --format sarif > kyber-weave-claude.sarif

    - name: Upload .claude/skills SARIF
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      with:
        sarif_file: kyber-weave-claude.sarif
        category: kyber-weave-claude

    - name: Validate .kilo/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill validate .kilo/skills --format table

    - name: Lint .kilo/skills
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill lint .kilo/skills --min-desc-score 70 --format table

    - name: Scan .kilo/skills (SARIF)
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- skill scan .kilo/skills --fail-on critical --format sarif > kyber-weave-kilo.sarif

    - name: Upload .kilo/skills SARIF
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      with:
        sarif_file: kyber-weave-kilo.sarif
        category: kyber-weave-kilo

  agent-gate:
    name: Kyber-Weave Agent Gate (${{ matrix.harness }})
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: Remove continue-on-error once all agents pass Kyber-Weave validation
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        harness: [codex, cursor, claude, github, opencode, kilo]

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        submodules: true

    - name: Setup .NET 10
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - name: Build Kyber-Weave
      run: dotnet build 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli/KyberWeave.Cli.csproj -c Release

    - name: Validate agents (${{ matrix.harness }})
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- agent validate . --harness ${{ matrix.harness }} --format table

    - name: Scan agents SARIF (${{ matrix.harness }})
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- agent scan . --harness ${{ matrix.harness }} --fail-on critical --format sarif > kyber-weave-agent-${{ matrix.harness }}.sarif

    - name: Upload agents SARIF (${{ matrix.harness }})
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      with:
        sarif_file: kyber-weave-agent-${{ matrix.harness }}.sarif
        category: kyber-weave-agent-${{ matrix.harness }}

  agent-sync:
    name: Kyber-Weave Agent Sync Check
    runs-on: ubuntu-latest
    continue-on-error: true  # TODO: Remove continue-on-error once sync-check is clean
    needs: unit-tests

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        submodules: true

    - name: Setup .NET 10
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: '10.0.x'

    - name: Build Kyber-Weave
      run: dotnet build 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli/KyberWeave.Cli.csproj -c Release

    - name: Cross-harness sync-check
      run: dotnet run --project 7-Deployment/tools/KyberWeave/src/KyberWeave.Cli -c Release --no-build -- agent sync-check . --format table

  # ===========================================================================
  # IaC SECURITY SCAN (runs on all nightly triggers)
  # ===========================================================================

  iac-scan:
    name: "IaC Security Scan (Checkov)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Install Checkov
      run: pip install checkov==3.3.8

    - name: Run Checkov - Dockerfiles
      run: |
        checkov -d 7-Deployment \
          --framework dockerfile \
          --config-file 7-Deployment/scanning/.checkov.yaml \
          --output sarif \
          --output-file-path checkov-dockerfile.sarif
      continue-on-error: true

    - name: Run Checkov - GitHub Actions
      run: |
        checkov -d .github \
          --framework github_actions \
          --config-file 7-Deployment/scanning/.checkov.yaml \
          --output sarif \
          --output-file-path checkov-github-actions.sarif
      continue-on-error: true

    - name: Upload Dockerfile SARIF
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      if: always() && hashFiles('checkov-dockerfile.sarif') != ''
      with:
        sarif_file: checkov-dockerfile.sarif
        category: "nightly-checkov-dockerfile"

    - name: Upload GitHub Actions SARIF
      uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
      if: always() && hashFiles('checkov-github-actions.sarif') != ''
      with:
        sarif_file: checkov-github-actions.sarif
        category: "nightly-checkov-github-actions"

  # ===========================================================================
  # CONTAINER SECURITY SCAN (triggered by 3 AM schedule or workflow_dispatch)
  # ===========================================================================

  trivy-container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Build API image
      run: docker build -f 7-Deployment/Dockerfile.api -t motorcycle-rag-api .

    - name: Build UI image
      run: docker build -f 7-Deployment/Dockerfile.ui -t motorcycle-rag-ui .

    # Only the API and UI images are deployed (see the two ContainerApps in
    # 7-Deployment/infrastructure/Program.cs). The local processor runs as a local
    # Python service under Admin Desktop and is never containerized or pushed to
    # ACR, so there is no processor image to scan here.

    # MEDIUM included for api/ui so GitHub Security can close residual OS-package
    # alerts (#647–#713) after Dockerfile package pins land and this job rebuilds.
    # Fail threshold unchanged: no exit-code (default 0); SARIF upload only.
    - name: Run Trivy on API image
      uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
      with:
        image-ref: motorcycle-rag-api
        format: sarif
        output: trivy-api.sarif
        severity: MEDIUM,HIGH,CRITICAL

    - name: Run Trivy on UI image
      uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
      with:
        image-ref: motorcycle-rag-ui
        format: sarif
        output: trivy-ui.sarif
        severity: MEDIUM,HIGH,CRITICAL

    - name: Upload API SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
      if: always() && hashFiles('trivy-api.sarif') != ''
      with:
        sarif_file: trivy-api.sarif
        category: nightly-trivy-container-api

    - name: Upload UI SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
      if: always() && hashFiles('trivy-ui.sarif') != ''
      with:
        sarif_file: trivy-ui.sarif
        category: nightly-trivy-container-ui

  # ===========================================================================
  # SUMMARY
  # ===========================================================================

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, end-to-end-tests, azure-integration-tests, load-tests, performance-analysis, skill-gate, agent-gate, agent-sync, iac-scan, trivy-container-scan]
    if: always()

    steps:
    - name: Download all test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: TestResults/

    - name: Generate test summary
      run: |
        echo "# Nightly Test & Security Scan Results" > test-summary.md
        echo "" >> test-summary.md
        echo "## Test Execution Summary" >> test-summary.md
        echo "" >> test-summary.md
        echo "| Test Suite | Status | Notes |" >> test-summary.md
        echo "|------------|--------|-------|" >> test-summary.md
        echo "| Unit Tests | ${{ needs.unit-tests.result }} | Core functionality validation |" >> test-summary.md
        echo "| Integration Tests | ${{ needs.integration-tests.result }} | Component integration validation |" >> test-summary.md
        echo "| End-to-End Tests | ${{ needs.end-to-end-tests.result }} | Complete user journey validation |" >> test-summary.md
        echo "| Azure Integration | ${{ needs.azure-integration-tests.result }} | Real Azure service validation |" >> test-summary.md
        echo "| Load Tests | ${{ needs.load-tests.result }} | Performance under load validation |" >> test-summary.md
        echo "| Performance Analysis | ${{ needs.performance-analysis.result }} | Performance metrics analysis |" >> test-summary.md
        echo "| Skill Gate | ${{ needs.skill-gate.result }} | Kyber-Weave skill validation |" >> test-summary.md
        echo "| Agent Gate | ${{ needs.agent-gate.result }} | Kyber-Weave agent validate/scan (parallel harnesses) |" >> test-summary.md
        echo "| Agent Sync | ${{ needs.agent-sync.result }} | Kyber-Weave cross-harness sync-check |" >> test-summary.md
        echo "| IaC Security Scan | ${{ needs.iac-scan.result }} | Checkov IaC scan |" >> test-summary.md
        echo "| Trivy Container Scan | ${{ needs.trivy-container-scan.result }} | Container vulnerability scan |" >> test-summary.md
        echo "" >> test-summary.md
        echo "## Key Metrics" >> test-summary.md
        echo "- Test Coverage: Target >90%" >> test-summary.md
        echo "- Response Time: Target <3s for 95th percentile" >> test-summary.md
        echo "- Concurrent Users: Target 100 users" >> test-summary.md
        echo "- Success Rate: Target >95%" >> test-summary.md
        echo "" >> test-summary.md
        echo "Generated on: $(date)" >> test-summary.md

    - name: Upload test summary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: test-summary
        path: test-summary.md
