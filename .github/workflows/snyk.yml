name: Snyk Security Scans (Nightly)

on:
  schedule:
    # Run daily at 3 AM UTC (offset from comprehensive-testing at 2 AM)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-sca:
    name: Snyk SCA (Dependencies)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: pip install poetry

    - name: Generate poetry.lock for Snyk
      working-directory: 2-Application/local-processing-service
      run: poetry lock --no-update

    # Pin Snyk CLI for reproducible scans — update manually or via Dependabot
    - name: Install Snyk CLI
      run: npm install -g snyk@1.1293.0

    - name: Snyk SCA test (all projects)
      run: snyk test --severity-threshold=high --all-projects --sarif-file-output=snyk-sca.sarif

    - name: Upload SCA SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk-sca.sarif
        category: nightly-snyk-sca

  snyk-sast:
    name: Snyk SAST (Code)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Pin Snyk CLI for reproducible scans — update manually or via Dependabot
    - name: Install Snyk CLI
      run: npm install -g snyk@1.1293.0

    - name: Snyk code test (SAST)
      run: snyk code test --severity-threshold=high --sarif-file-output=snyk-sast.sarif

    - name: Upload SAST SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk-sast.sarif
        category: nightly-snyk-sast

  snyk-container-api:
    name: Snyk Container — API
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Pin Snyk CLI for reproducible scans — update manually or via Dependabot
    - name: Install Snyk CLI
      run: npm install -g snyk@1.1293.0

    - name: Build API image
      run: docker build -f 7-Deployment/Dockerfile.api -t motorcycle-rag-api .

    - name: Snyk container test — API
      run: snyk container test motorcycle-rag-api --file=7-Deployment/Dockerfile.api --severity-threshold=high --sarif-file-output=snyk-container-api.sarif

    - name: Upload API container SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk-container-api.sarif
        category: nightly-snyk-container-api

  snyk-container-ui:
    name: Snyk Container — UI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Pin Snyk CLI for reproducible scans — update manually or via Dependabot
    - name: Install Snyk CLI
      run: npm install -g snyk@1.1293.0

    - name: Build UI image
      run: docker build -f 7-Deployment/Dockerfile.ui -t motorcycle-rag-ui .

    - name: Snyk container test — UI
      run: snyk container test motorcycle-rag-ui --file=7-Deployment/Dockerfile.ui --severity-threshold=high --sarif-file-output=snyk-container-ui.sarif

    - name: Upload UI container SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk-container-ui.sarif
        category: nightly-snyk-container-ui

  snyk-container-processor:
    name: Snyk Container — Local Processor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Pin Snyk CLI for reproducible scans — update manually or via Dependabot
    - name: Install Snyk CLI
      run: npm install -g snyk@1.1293.0

    - name: Build Local Processor image
      run: docker build -f 2-Application/local-processing-service/Dockerfile -t local-processor 2-Application/local-processing-service/

    - name: Snyk container test — Local Processor
      run: snyk container test local-processor --file=2-Application/local-processing-service/Dockerfile --severity-threshold=high --sarif-file-output=snyk-container-processor.sarif

    - name: Upload Processor container SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: snyk-container-processor.sarif
        category: nightly-snyk-container-processor
