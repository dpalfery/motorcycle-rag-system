name: Build & Deploy to Azure

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "20.x"
  PULUMI_STACK: "dev"
  PULUMI_WORK_DIR: "7-Deployment/infrastructure"
  ACR_NAME: "mcrragenveusacr" # Update with your ACR name

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build React UI
        run: |
          cd 1-Presentation/MotorcycleRag.WebUI
          npm install
          npm run build

      - name: Copy UI Assets to BFF
        run: |
          mkdir -p 1-Presentation/MotorcycleRag.WebUI.BFF/wwwroot
          cp -r 1-Presentation/MotorcycleRag.WebUI/dist/* 1-Presentation/MotorcycleRag.WebUI.BFF/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Docker Images
        run: |
          # Build & Push API
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/motorcycle-rag-api:latest -f 7-Deployment/Dockerfile.api .
          docker push ${{ env.ACR_NAME }}.azurecr.io/motorcycle-rag-api:latest

          # Build & Push UI
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/MotorcycleRag.WebUI:latest -f 7-Deployment/Dockerfile.ui .
          docker push ${{ env.ACR_NAME }}.azurecr.io/motorcycle-rag-ui:latest

      - name: Pulumi Up
        uses: pulumi/actions@v4
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: ${{ env.PULUMI_WORK_DIR }}
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PULUMI_CONFIG_PASSPHRASE: ""
          PULUMI_CONFIG_LOCATION: "eastus"

