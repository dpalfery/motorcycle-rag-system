# Sample: Kyber-Weave skill validate / lint / scan
#
# Copy to .github/workflows/ and replace PIN placeholders.
# See README.md in this directory for feed auth and path adaptation.

name: Kyber-Weave Skill Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-skill-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PIN: published KyberWeave.Tool SemVer — replace before production use
  KYBER_WEAVE_VERSION: "0.1.0"
  # PIN: SDK band matching the tool TFM (net10.0 → 10.0.x)
  DOTNET_VERSION: "10.0.x"
  # Space-separated skill roots. Missing directories are skipped.
  SKILL_DIRS: ".agents/skills"
  # Leave empty for nuget.org; set for a private feed (see README).
  KYBER_WEAVE_NUGET_SOURCE: ""
  MIN_DESC_SCORE: "70"

jobs:
  skill-gate:
    name: Skill validate / lint / scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Kyber-Weave NuGet source
        if: ${{ env.KYBER_WEAVE_NUGET_SOURCE != '' }}
        run: >
          dotnet nuget add source "${{ env.KYBER_WEAVE_NUGET_SOURCE }}"
          --name kyber-weave
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_AUTH_TOKEN }}"
          --store-password-in-clear-text

      - name: Install Kyber-Weave tool (pinned)
        run: >
          dotnet tool install --global KyberWeave.Tool
          --version "${{ env.KYBER_WEAVE_VERSION }}"

      - name: Validate / lint / scan skill directories
        run: |
          set -euo pipefail
          EXIT_CODE=0
          mkdir -p kyber-weave-sarif
          for skills_dir in ${SKILL_DIRS}
          do
            if [ ! -d "${skills_dir}" ]
            then
              echo "Skipping missing skill directory: ${skills_dir}"
              continue
            fi
            safe_name=$(echo "${skills_dir}" | tr '/.' '__')
            echo "::group::${skills_dir}"
            kyber-weave skill validate "${skills_dir}" --format table || EXIT_CODE=1
            kyber-weave skill lint "${skills_dir}" --min-desc-score "${MIN_DESC_SCORE}" --format table || EXIT_CODE=1
            kyber-weave skill scan "${skills_dir}" --fail-on critical --format sarif \
              > "kyber-weave-sarif/skills-${safe_name}.sarif" || EXIT_CODE=1
            echo "::endgroup::"
          done
          exit "${EXIT_CODE}"

      - name: Upload skill scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: kyber-weave-sarif
          category: kyber-weave-skills
