name: "CodeQL"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 00:00 UTC as a fallback
    - cron: "0 0 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          # Use security-extended query suite for broader vulnerability coverage
          queries: security-extended
          category: "/language:csharp"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: "nuget"
          cache-dependency-path: "MotorcycleRAG.sln"

      - name: Build solution
        run: |
          dotnet restore MotorcycleRAG.sln
          dotnet build MotorcycleRAG.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
