# Sample: Kyber-Weave agent validate / scan / sync-check
#
# Copy to .github/workflows/ and replace PIN placeholders.
# See README.md in this directory for feed auth and harness adaptation.

name: Kyber-Weave Agent Gate

"on":
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: kyber-weave-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PIN: published KyberWeave.Tool SemVer — replace before production use
  KYBER_WEAVE_VERSION: "0.1.0"
  # PIN: SDK band matching the tool TFM (net10.0 → 10.0.x)
  DOTNET_VERSION: "10.0.x"
  # Leave empty for nuget.org; set for a private feed (see README).
  KYBER_WEAVE_NUGET_SOURCE: ""
  # Repository root passed to agent commands (harnesses discovered under .*/agents).
  PROJECT_ROOT: "."

jobs:
  agent-gate:
    name: Agent validate / scan (${{ matrix.harness }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Adapt to the harnesses your host keeps in sync.
        harness: [codex, cursor, claude, github, opencode, kilo]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Kyber-Weave NuGet source
        if: ${{ env.KYBER_WEAVE_NUGET_SOURCE != '' }}
        run: >
          dotnet nuget add source "${{ env.KYBER_WEAVE_NUGET_SOURCE }}"
          --name kyber-weave
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_AUTH_TOKEN }}"
          --store-password-in-clear-text

      - name: Install Kyber-Weave tool (pinned)
        run: >
          dotnet tool install --global KyberWeave.Tool
          --version "${{ env.KYBER_WEAVE_VERSION }}"

      - name: Validate agents (${{ matrix.harness }})
        run: >
          kyber-weave agent validate "${{ env.PROJECT_ROOT }}"
          --harness ${{ matrix.harness }}
          --format table

      - name: Scan agents SARIF (${{ matrix.harness }})
        run: >
          kyber-weave agent scan "${{ env.PROJECT_ROOT }}"
          --harness ${{ matrix.harness }}
          --fail-on critical
          --format sarif
          > "kyber-weave-agent-${{ matrix.harness }}.sarif"

      - name: Upload agents SARIF (${{ matrix.harness }})
        if: always()
        uses: github/codeql-action/upload-sarif@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4
        with:
          sarif_file: kyber-weave-agent-${{ matrix.harness }}.sarif
          category: kyber-weave-agent-${{ matrix.harness }}

  agent-sync:
    name: Agent sync-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add Kyber-Weave NuGet source
        if: ${{ env.KYBER_WEAVE_NUGET_SOURCE != '' }}
        run: >
          dotnet nuget add source "${{ env.KYBER_WEAVE_NUGET_SOURCE }}"
          --name kyber-weave
          --username "${{ github.actor }}"
          --password "${{ secrets.NUGET_AUTH_TOKEN }}"
          --store-password-in-clear-text

      - name: Install Kyber-Weave tool (pinned)
        run: >
          dotnet tool install --global KyberWeave.Tool
          --version "${{ env.KYBER_WEAVE_VERSION }}"

      - name: Cross-harness sync-check
        run: >
          kyber-weave agent sync-check "${{ env.PROJECT_ROOT }}"
          --format table
